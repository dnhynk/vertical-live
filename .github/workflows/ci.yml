name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

      # The accelerated soak of TASK_SPECS §T15 합격 기준 2: 72 hours of scenario
      # time on a virtual clock, with the recoverable fault matrix rows injected
      # on a schedule. It runs after `build` because it drives the built CLI, and
      # it fails the job when an invariant of spec §9.2/§11 is broken.
      - run: npm run soak:ci
